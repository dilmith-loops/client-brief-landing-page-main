name: Build and Deploy to Hostinger Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Production Website
        run: npm run build
        env:
          VITE_BASE_PATH: /firstcapital/

      - name: Deploy to deploy Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy
          folder: .output/public
          clean: true
          commit-message: "deploy: build for Hostinger subdirectory /firstcapital [skip ci]"
